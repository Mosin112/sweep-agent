# Create the app at https://api.slack.com/apps → Create New App → From an app manifest
display_information:
  name: Sweep Agent
  description: Finds idle treasury cash and asks for approval before putting it to work.
  background_color: "#1f2937"
features:
  bot_user:
    display_name: sweep-agent
    always_online: true
  slash_commands:
    - command: /sweep
      description: Run a treasury sweep and post proposals for approval
      usage_hint: "[offline]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
